<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy Help</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat" aria-label="ShopEasy help chat">
    <header class="chat__header">
      <h1>ShopEasy help</h1>
      <p>Ask about orders, shipping, returns, or payments.</p>
    </header>

    <div id="messages" class="chat__messages" role="log" aria-live="polite">
      <div class="msg msg--bot">
        <div class="bubble">Hi! What can I help you with today?</div>
      </div>
    </div>

    <div class="chat__suggestions" id="suggestions">
      {% for s in suggestions %}
      <button type="button" class="chip">{{ s }}</button>
      {% endfor %}
    </div>

    <form id="chat-form" class="chat__form" autocomplete="off">
      <label for="user-input" class="sr-only">Your question</label>
      <input id="user-input" type="text" maxlength="500" placeholder="Type your question" required>
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
